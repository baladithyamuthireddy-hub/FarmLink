    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="topbar-title" data-i18n="dNavMyOffers">My Active Bids & Negotiations</h1>
        </div>
        <div class="topbar-right">
          <button class="lang-toggle-btn" onclick="toggleLanguage()"><span>🌐</span><span class="lang-toggle-text">తెలుగు</span></button>
          <button class="theme-toggle-btn" onclick="toggleTheme()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg><span class="theme-label">Dark</span>
          </button>
        </div>

      <div class="content-container" style="max-width: 960px;">
        
        <!-- Status Filter Tabs -->
        <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem;">
          <button class="btn btn-sm btn-primary dealer-filter-tab" onclick="filterDealerOffers('active')">Active Negotiations</button>
          <button class="btn btn-sm btn-secondary dealer-filter-tab" onclick="filterDealerOffers('all')">All Bids</button>
          <button class="btn btn-sm btn-secondary dealer-filter-tab" onclick="filterDealerOffers('accepted')">Finalized Deals</button>
        </div>

        <div id="dealer-offers-list">
          <!-- Populated via JS -->
        </div>
      </div>
    </div>

  <!-- Dealer Raise Modal -->
  <div id="modal-raise-offer" class="modal-backdrop">
    <div class="modal" style="max-width: 500px;">
      <div class="modal-header">
        <h3 class="modal-title">Revise Bid Price</h3>
        <button class="modal-close" onclick="window.App.closeModal('modal-raise-offer')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="modal-raise-offer-id">
        <div id="modal-raise-crop-info" style="margin-bottom: 1rem; padding: 0.75rem; background: var(--bg-surface-secondary); border-radius: var(--radius-md); font-size: 0.9rem;"></div>
        <div class="form-group">
          <label class="form-label">New Bid Price (₹ per unit)</label>
          <input type="number" id="modal-raise-price" class="form-control" step="0.5" required oninput="evaluateRaiseFairness()">
          <div id="modal-raise-fair-hint" style="margin-top: 0.5rem;"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Terms / Note for Farmer</label>
          <textarea id="modal-raise-note" class="form-control" rows="3" placeholder="Explain adjusted payment/logistics terms..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="window.App.closeModal('modal-raise-offer')" data-i18n="btnCancel">Cancel</button>
        <button class="btn btn-primary" onclick="submitDealerRaiseAction()" data-i18n="btnSubmit">Submit Revised Bid</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs (Phase 1 Bridge) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/translations.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/market.js"></script>
  <script src="../js/offers.js"></script>
  <script src="../js/app.js"></script>

  <script>
    if (window.Auth && !window.Auth.requireAuth("dealer")) {}

    let dealerOffers = [];
    let currentDealerFilter = "active";
    let activeRaiseOffer = null;

    document.addEventListener("DOMContentLoaded", () => {
      loadDealerOffers();
      if (window.Storage && typeof window.Storage.initOffersSync === "function") {
        window.Storage.initOffersSync((syncedOffers) => {
          if (Array.isArray(syncedOffers)) {
            const user = window.Auth.getCurrentUser();
            if (user) {
              dealerOffers = syncedOffers.filter(o => o.dealerId === user.id || (user.uid && (o.dealerId === user.uid || o.dealerUid === user.uid)));
              renderFilteredDealerOffers();
            }
          } else {
            loadDealerOffers();
          }
        }, "dealer");
      }
    });

    async function loadDealerOffers() {
      const user = window.Auth.getCurrentUser();
      if (!user) return;

      const container = document.getElementById("dealer-offers-list");
      const existing = window.Storage.getOffers().filter(o => o.dealerId === user.id || (user.uid && (o.dealerId === user.uid || o.dealerUid === user.uid)));
      if (existing.length === 0 && container) {
        container.innerHTML = `
          <div style="text-align: center; padding: 3rem 1.5rem; color: var(--text-muted);">
            <div class="spinner" style="margin: 0 auto 1rem auto; width: 32px; height: 32px; border: 3px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
            <p>Syncing cloud offers...</p>
          </div>
        `;
      }

      try {
        if (window.Storage && typeof window.Storage.syncOffersFromFirestore === "function") {
          await window.Storage.syncOffersFromFirestore("dealer");
        }
      } catch (err) {
        console.warn("[FarmLink Dealer Offers] Sync note:", err);
      }

      const allOffers = window.Storage.getOffers();
      dealerOffers = allOffers.filter(o => o.dealerId === user.id || (user.uid && (o.dealerId === user.uid || o.dealerUid === user.uid)));
      renderFilteredDealerOffers();
    }

    function filterDealerOffers(type) {
      currentDealerFilter = type;
      document.querySelectorAll(".dealer-filter-tab").forEach(tab => {
        tab.className = "btn btn-sm btn-secondary dealer-filter-tab";
      });
      if (event && event.target) {
        event.target.className = "btn btn-sm btn-primary dealer-filter-tab";
      }
      renderFilteredDealerOffers();
    }

    function renderFilteredDealerOffers() {
      const container = document.getElementById("dealer-offers-list");
      let list = dealerOffers;

      if (currentDealerFilter === "active") {
        list = dealerOffers.filter(o => {
          const s = (o.status || "").toLowerCase();
          return s === "pending" || s === "countered";
        });
      } else if (currentDealerFilter === "accepted") {
        list = dealerOffers.filter(o => (o.status || "").toLowerCase() === "accepted");
      }

      if (dealerOffers.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="text-align: center; padding: 3rem 1.5rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🌾</div>
            <div class="empty-state-title" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;" data-i18n="noOffersYet">No offers submitted yet</div>
            <p class="empty-state-desc" style="color: var(--text-muted); margin-bottom: 1.25rem;">Browse regional crop listings and submit an offer to begin direct negotiation with farmers.</p>
            <a href="marketplace.html" class="btn btn-primary btn-sm">Explore Marketplace</a>
          </div>
        `;
      } else if (list.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="text-align: center; padding: 3rem 1.5rem; background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px dashed var(--border-color);">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔍</div>
            <div class="empty-state-title" style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">No offers in this filter</div>
            <p class="empty-state-desc" style="color: var(--text-muted); margin-bottom: 1.25rem;">Try viewing all offers to see your full bidding history.</p>
            <button class="btn btn-outline btn-sm" onclick="filterDealerOffers('all')">View All Bids</button>
          </div>
        `;
      } else {
        container.innerHTML = list.map(o => window.Offers.renderOfferCard(o, "dealer")).join("");
      }
      if (window.I18n && typeof window.I18n.applyTranslations === "function") window.I18n.applyTranslations();
    }

    function openDealerRaiseModal(offerId, currentPrice) {
      activeRaiseOffer = dealerOffers.find(o => o.id === offerId) || window.Storage.getOffers().find(o => o.id === offerId);

      document.getElementById("modal-raise-offer-id").value = offerId;
      document.getElementById("modal-raise-price").value = Number(currentPrice);
      document.getElementById("modal-raise-note").value = "";

      if (activeRaiseOffer) {
        const crop = window.Storage ? window.Storage.getCropById(activeRaiseOffer.cropId) : null;
        const asking = Number(activeRaiseOffer.farmerExpectedPrice || (crop ? crop.expectedPrice : 0));
        const farmerSteps = (activeRaiseOffer.history || []).filter(h => h.sender === "farmer");
        const farmerCounter = farmerSteps.length > 0
          ? Number(farmerSteps[farmerSteps.length - 1].price)
          : (activeRaiseOffer.farmerCounterPrice ? Number(activeRaiseOffer.farmerCounterPrice) : null);
        const dealerSteps = (activeRaiseOffer.history || []).filter(h => h.sender === "dealer");
        const dealerBid = dealerSteps.length > 0
          ? Number(dealerSteps[dealerSteps.length - 1].price)
          : Number(activeRaiseOffer.dealerOfferPrice || activeRaiseOffer.offeredPrice || 0);

        let details = `Farmer Expected: <strong>₹${asking}/${activeRaiseOffer.unit || 'kg'}</strong>`;
        if (farmerCounter) {
          details += ` • Farmer Counter-Offer: <strong style="color: #b45309;">₹${farmerCounter}/${activeRaiseOffer.unit || 'kg'}</strong>`;
        }
        if (dealerBid) {
          details += ` • Your Last Bid: <strong>₹${dealerBid}/${activeRaiseOffer.unit || 'kg'}</strong>`;
        }

        document.getElementById("modal-raise-crop-info").innerHTML = `
          <strong>${activeRaiseOffer.cropTitle || activeRaiseOffer.cropName}</strong> — Lot: ${activeRaiseOffer.quantity || activeRaiseOffer.requestedQuantity} ${activeRaiseOffer.unit || 'kg'}
          <div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">${details}</div>
        `;
      }
      evaluateRaiseFairness();
      window.App.openModal("modal-raise-offer");
    }

    function evaluateRaiseFairness() {
      const price = Number(document.getElementById("modal-raise-price").value) || 0;
      const hint = document.getElementById("modal-raise-fair-hint");
      if (activeRaiseOffer && price > 0 && window.Market) {
        const cropName = activeRaiseOffer.cropTitle || activeRaiseOffer.cropName;
        hint.innerHTML = window.Market.renderPriceBenchmarkBadge(cropName, price);
      } else {
        hint.innerHTML = "";
      }
    }

    async function submitDealerRaiseAction() {
      const offerId = document.getElementById("modal-raise-offer-id").value;
      const newPrice = Number(document.getElementById("modal-raise-price").value);
      const note = document.getElementById("modal-raise-note").value.trim();

      if (!newPrice || newPrice <= 0) {
        window.App.showToast("Please enter a valid positive revised bid price.", "warning");
        return;
      }

      const submitBtn = document.querySelector("#modal-raise-offer .btn-primary");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting...";
      }

      try {
        const res = await window.Offers.counterOffer(offerId, newPrice, note, "dealer");
        if (res.success) {
          window.App.closeModal("modal-raise-offer");
          window.App.showToast("Revised bid submitted to farmer!", "success");
          await loadDealerOffers();
        } else {
          window.App.showToast(res.message || "Could not submit revised bid.", "error");
        }
      } catch (err) {
        window.App.showToast(err.message || "Could not submit revised bid.", "error");
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Revised Bid";
        }
      }
    }

    async function handleDealerAcceptOffer(offerId) {
      if (confirm("Accept the farmer's price and close this procurement purchase?")) {
        try {
          const res = await window.Offers.acceptOffer(offerId, "dealer");
          if (res.success) {
            window.App.showToast("Deal closed! Offer accepted.", "success");
            await loadDealerOffers();
          } else {
            window.App.showToast(res.message || "Failed to accept offer.", "error");
          }
        } catch (err) {
          window.App.showToast(err.message || "Failed to accept offer.", "error");
        }
      }
    }

    async function handleCancelOffer(offerId) {
      if (confirm("Cancel this procurement offer? This will withdraw your bid.")) {
        try {
          const res = await window.Offers.cancelOffer(offerId);
          if (res.success) {
            window.App.showToast("Offer withdrawn and cancelled.", "info");
            await loadDealerOffers();
          } else {
            window.App.showToast(res.message || "Failed to cancel offer.", "error");
          }
        } catch (err) {
          window.App.showToast(err.message || "Failed to cancel offer.", "error");
        }
      }
    }
  </script>
</body>
