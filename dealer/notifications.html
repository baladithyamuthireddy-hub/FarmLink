    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="topbar-title" data-i18n="notificationsTitle">Notifications</h1>
        </div>
        <div class="topbar-right">
          <button class="lang-toggle-btn" onclick="toggleLanguage()"><span>🌐</span><span class="lang-toggle-text">తెలుగు</span></button>
          <button class="theme-toggle-btn" onclick="toggleTheme()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg><span class="theme-label">Dark</span>
          </button>
          <button class="btn btn-secondary btn-sm" onclick="markAllRead()" data-i18n="markAllRead">Mark All as Read</button>
        </div>
      </header>

      <div class="content-container">
        
        <!-- Controls Bar -->
        <div class="card" style="margin-bottom: 1.5rem; padding: 1rem 1.25rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.75rem;">
          <div style="display: flex; gap: 0.5rem;">
            <button id="tab-all" class="btn btn-sm btn-primary" onclick="switchTab('all')" data-i18n="notificationsAll">All Notifications</button>
            <button id="tab-unread" class="btn btn-sm btn-secondary" onclick="switchTab('unread')" data-i18n="notificationsUnread">Unread Only</button>
          </div>
          <div class="text-sm text-muted" id="notif-count-summary">Loading notifications...</div>
        </div>

        <!-- Notifications Container -->
        <div id="notifications-container" style="display: flex; flex-direction: column; gap: 0.75rem;">
          <!-- Rendered dynamically -->
        </div>

      </div>

  <!-- Firebase SDKs (Phase 1 Bridge) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/translations.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>

  <script>
    if (window.Auth && !window.Auth.requireAuth("dealer")) {}

    let currentTab = "all";

    document.addEventListener("DOMContentLoaded", () => {
      loadNotifications();
      if (window.Storage) {
        window.Storage.syncNotificationsFromFirestore("dealer").then(() => {
          loadNotifications();
        });
        window.Storage.initNotificationsSync(() => {
          loadNotifications();
        }, "dealer");
      }
    });

    window.addEventListener("farmlink:notifications-updated", () => {
      loadNotifications();
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById("tab-all").className = tab === "all" ? "btn btn-sm btn-primary" : "btn btn-sm btn-secondary";
      document.getElementById("tab-unread").className = tab === "unread" ? "btn btn-sm btn-primary" : "btn btn-sm btn-secondary";
      loadNotifications();
    }

    function getNotificationIcon(type) {
      switch (type) {
        case "offer": return "🏷️";
        case "counter": return "🔄";
        case "deal":
        case "accepted": return "🎉";
        case "rejected": return "❌";
        case "cancelled": return "⚠️";
        case "matching_crop": return "🌱";
        case "message": return "💬";
        case "transaction": return "💰";
        case "review": return "⭐";
        default: return "🔔";
      }
    }

    function loadNotifications() {
      const user = window.Auth ? window.Auth.getCurrentUser() : null;
      if (!user) return;

      let notifs = window.Storage.getNotifications(user.uid || user.id, "dealer");
      const unreadCount = notifs.filter(n => !(n.isRead || n.read)).length;

      const countEl = document.getElementById("notif-count-summary");
      const isTe = window.I18n && window.I18n.currentLang === "te";
      if (countEl) {
        countEl.textContent = isTe
          ? `మొత్తం: ${notifs.length} | చదవనివి: ${unreadCount}`
          : `Total: ${notifs.length} | Unread: ${unreadCount}`;
      }

      if (currentTab === "unread") {
        notifs = notifs.filter(n => !(n.isRead || n.read));
      }

      const container = document.getElementById("notifications-container");
      if (!container) return;

      if (notifs.length === 0) {
        container.innerHTML = `
          <div class="card" style="padding: 3rem 1.5rem; text-align: center; color: var(--text-muted);">
            <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🔔</div>
            <h4 style="margin-bottom: 0.25rem;" data-i18n="noNotifications">No notifications found</h4>
            <p style="font-size: 0.85rem;" data-i18n="allCaughtUp">You are all caught up!</p>
          </div>
        `;
        if (window.I18n && typeof window.I18n.applyTranslations === "function") window.I18n.applyTranslations();
        return;
      }

      container.innerHTML = notifs.map(n => {
        const isRead = !!(n.isRead || n.read);
        const title = (isTe && n.titleTe) ? n.titleTe : (n.title || "Notification");
        const msg = (isTe && n.messageTe) ? n.messageTe : (n.message || "");
        const timeStr = window.App ? window.App.formatRelativeTime(n.timestamp || n.createdAt) : "";
        const icon = getNotificationIcon(n.type);

        const safeTitle = escapeHtml(title);
        const safeMsg = escapeHtml(msg);
        const safeTimeStr = escapeHtml(timeStr);
        const safeId = escapeHtml(n.id || "");
        const safeLink = escapeHtml(n.link || "");

        return `
          <div class="card" style="padding: 1.1rem 1.25rem; display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; border-left: 4px solid ${isRead ? 'transparent' : 'var(--blue-600)'}; background: ${isRead ? 'var(--bg-surface)' : 'rgba(37, 99, 235, 0.05)'}; transition: background 0.15s ease;">
            <div style="display: flex; gap: 1rem; align-items: flex-start; flex: 1; cursor: pointer;" data-id="${safeId}" data-link="${safeLink}" onclick="handleClickNotif(this.dataset.id, this.dataset.link)">
              <div style="font-size: 1.5rem; width: 40px; height: 40px; border-radius: var(--radius-full); background: var(--bg-surface-secondary); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                ${icon}
              </div>
              <div style="flex: 1;">
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem;">
                  <h4 style="font-size: 0.95rem; font-weight: ${isRead ? '600' : '700'}; margin: 0; color: var(--text-primary);">${safeTitle}</h4>
                  ${!isRead ? '<span class="badge badge-primary" style="font-size: 0.65rem; padding: 0.15rem 0.45rem;">NEW</span>' : ''}
                </div>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin: 0 0 0.35rem 0; line-height: 1.4;">${safeMsg}</p>
                <span style="font-size: 0.72rem; color: var(--text-muted);">${safeTimeStr}</span>
              </div>
            </div>

            <div style="display: flex; gap: 0.35rem; align-items: center; flex-shrink: 0;">
              ${!isRead ? `
                <button class="btn btn-outline btn-sm" data-id="${safeId}" onclick="markSingleRead(this.dataset.id)" title="Mark Read" data-i18n="markAsRead">Mark Read</button>
              ` : ''}
              <button class="btn btn-danger btn-sm" data-id="${safeId}" onclick="deleteNotif(this.dataset.id)" title="Delete" style="padding: 0.35rem 0.6rem;">&times;</button>
            </div>
          </div>
        `;
      }).join("");

      if (window.I18n && typeof window.I18n.applyTranslations === "function") window.I18n.applyTranslations();
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str).replace(/[&<>"']/g, m => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[m]);
    }

    function handleClickNotif(id, link) {
      if (window.Storage && id) {
        window.Storage.markNotificationAsRead(id);
        if (window.App) window.App.updateNotificationBadge();
      }
      if (link && typeof link === "string" && link.trim() !== "") {
        const cleanLink = link.trim();
        if (/^javascript:/i.test(cleanLink)) {
          loadNotifications();
          return;
        }
        window.location.href = cleanLink;
      } else {
        loadNotifications();
      }
    }

    function markSingleRead(id) {
      if (window.Storage && id) {
        window.Storage.markNotificationAsRead(id);
        if (window.App) window.App.updateNotificationBadge();
        loadNotifications();
      }
    }

    function markAllRead() {
      const user = window.Auth ? window.Auth.getCurrentUser() : null;
      if (window.Storage && user) {
        window.Storage.markAllNotificationsAsRead(user.uid || user.id, "dealer");
        if (window.App) {
          window.App.updateNotificationBadge();
          window.App.showToast("All notifications marked as read.", "success");
        }
        loadNotifications();
      }
    }

    function deleteNotif(id) {
      if (window.Storage && id) {
        window.Storage.deleteNotification(id);
        if (window.App) {
          window.App.updateNotificationBadge();
          window.App.showToast("Notification deleted.", "info");
        }
        loadNotifications();
      }
    }
  </script>
