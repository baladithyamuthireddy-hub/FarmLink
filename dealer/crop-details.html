            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>

            <span class="user-name user-name-display">Dealer</span>
            <span class="user-role user-role-display">DEALER</span>
          </div>
        </div>
        <button class="btn-icon" onclick="logoutUser()" title="Logout"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
      </div>

    <div class="main-wrapper">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-toggle">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <a href="marketplace.html" class="btn btn-secondary btn-sm" style="margin-right: 0.5rem;">← Back</a>
          <h1 class="topbar-title">Crop Details</h1>
        </div>
        <div class="topbar-right">
          <button class="lang-toggle-btn" onclick="toggleLanguage()"><span>🌐</span><span class="lang-toggle-text">తెలుగు</span></button>
          <button class="theme-toggle-btn" onclick="toggleTheme()">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg><span class="theme-label">Dark</span>
          </button>
        </div>
      </header>

      <div class="content-container" style="max-width: 1000px;">
        <div id="crop-details-view">
          <!-- Populated via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Make Offer Modal -->
  <div id="modal-make-offer" class="modal-backdrop">
    <div class="modal" style="max-width: 520px;">
      <div class="modal-header">
        <h3 class="modal-title" data-i18n="btnMakeOffer">Submit Procurement Offer</h3>
        <button class="modal-close" onclick="window.App.closeModal('modal-make-offer')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="offer-crop-id">
        <div id="offer-crop-modal-info" style="margin-bottom: 0.85rem; padding: 0.6rem 0.75rem; background: var(--bg-surface-secondary); border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--text-secondary);"></div>
        <div class="form-row" style="display: flex; gap: 0.75rem;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label" data-i18n="offerPricePerUnit">Your Bid Price (₹ per unit)</label>
            <input type="number" id="offer-bid-price" class="form-control" step="0.5" required oninput="evaluateBidFairness()">
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label" data-i18n="quantityRequested">Quantity Requested</label>
            <input type="number" id="offer-bid-qty" class="form-control" step="1" required oninput="evaluateBidFairness()">
          </div>
        </div>
        <div id="offer-fair-preview" style="margin-bottom: 0.75rem;"></div>
        <div style="background: rgba(22, 163, 74, 0.08); border: 1px solid rgba(22, 163, 74, 0.2); border-radius: var(--radius-md); padding: 0.75rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.85rem; font-weight: 600;" data-i18n="estimatedTotalOffer">Estimated Deal Amount:</span>
          <span id="offer-total-amount" style="font-size: 1.15rem; font-weight: 800; color: var(--primary-700);">₹0</span>
        </div>
        <div class="form-group">
          <label class="form-label">Logistics & Payment Terms</label>
          <textarea id="offer-note" class="form-control" rows="3" placeholder="e.g. We will send our transport vehicle to Tadikonda on Monday. Payment via immediate bank transfer upon weighing."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="window.App.closeModal('modal-make-offer')" data-i18n="btnCancel">Cancel</button>
        <button id="btn-submit-offer" class="btn btn-primary" onclick="submitOfferAction()" data-i18n="btnSubmit">Submit Offer</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDKs (Phase 1 Bridge) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/translations.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/market.js"></script>
  <script src="../js/crops.js"></script>
  <script src="../js/offers.js"></script>
  <script src="../js/app.js"></script>

  <script>
    if (window.Auth && !window.Auth.requireAuth("dealer")) {}

    let currentCrop = null;

    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const cropId = urlParams.get("id") || "crop_1";
      loadCropDetails(cropId);
    });

    async function loadCropDetails(id) {
      currentCrop = window.Storage.getCropById(id);
      if (!currentCrop && window.Storage && typeof window.Storage.fetchCropByIdFromFirestore === "function") {
        currentCrop = await window.Storage.fetchCropByIdFromFirestore(id);
      }
      if (!currentCrop) {
        document.getElementById("crop-details-view").innerHTML = `
          <div class="empty-state">
            <div class="empty-state-title">Crop listing not found</div>
            <a href="marketplace.html" class="btn btn-primary btn-sm">Return to Marketplace</a>
          </div>
        `;
        return;
      }

      const farmer = window.Storage.getUserById(currentCrop.farmerId) || {
        name: currentCrop.farmerName,
        phone: currentCrop.farmerPhone,
        rating: 4.9,
        totalTransactions: 34,
        location: currentCrop.location
      };

      const cropName = currentCrop.cropName || currentCrop.title || "Agricultural Produce";
      const fairBadge = window.Market ? window.Market.renderPriceBenchmarkBadge(cropName, currentCrop.expectedPrice) : "";
      const evaluation = window.Market ? window.Market.evaluateOffer(cropName, currentCrop.expectedPrice) : null;
      
      const rawStatus = String(currentCrop.status || "Available").trim();
      const statusLower = rawStatus.toLowerCase();
      const displayStatus = (statusLower === "active" || statusLower === "available") ? "Available" : rawStatus;
      let statusBadgeClass = "badge-success";
      if (statusLower === "under negotiation") statusBadgeClass = "badge-warning";
      if (statusLower === "sold") statusBadgeClass = "badge-grade-b";
      if (statusLower === "removed") statusBadgeClass = "badge-danger";

      const isSold = statusLower === "sold";
      const isRemoved = statusLower === "removed";
      const isUnavailable = isSold || isRemoved;

      document.getElementById("crop-details-view").innerHTML = `
        <div style="display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 2rem;">
          <div>
            <img src="${currentCrop.image}" style="width: 100%; height: 320px; object-fit: cover; border-radius: var(--radius-lg); margin-bottom: 1.5rem; border: 1px solid var(--border-color);">

            <div class="card" style="margin-bottom: 1.5rem;">
              <h3 style="font-size: 1.25rem; margin-bottom: 0.75rem;">Quality Specifications & Transparency</h3>
              <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap;">
                <span class="badge badge-grade-a" style="font-size: 0.85rem;">${currentCrop.qualityGrade || 'Grade A'}</span>
                <span class="badge badge-success">${currentCrop.category || 'Produce'}</span>
                <span class="badge ${statusBadgeClass}">${displayStatus}</span>
              </div>
              <p class="text-sm" style="margin-bottom: 0.5rem; line-height: 1.6;">
                <strong>Harvest Date:</strong> ${currentCrop.harvestDate || 'Fresh'}
              </p>
              ${currentCrop.variety ? `
                <p class="text-sm" style="margin-bottom: 0.5rem; line-height: 1.6;">
                  <strong>Variety:</strong> ${currentCrop.variety}
                </p>
              ` : ''}
              <p class="text-sm" style="margin-bottom: 1rem; line-height: 1.6;">
                <strong>Farmer Quality Notes:</strong> ${currentCrop.gradeDetails || 'Certified quality produce inspected directly at farm.'}
              </p>
              <p class="text-sm text-muted" style="line-height: 1.6;">
                ${currentCrop.description || 'Authentic regional crop listed directly on FarmLink.'}
              </p>
            </div>
          </div>

          <div>
            <div class="card" style="margin-bottom: 1.5rem;">
              <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;">${cropName}</h2>
              <div class="text-sm text-muted" style="margin-bottom: 1.25rem;">
                📍 ${currentCrop.location} • ${currentCrop.district || 'Andhra Pradesh'}
              </div>

              <div style="background: var(--bg-surface-secondary); padding: 1.25rem; border-radius: var(--radius-md); margin-bottom: 1.25rem;">
                <div class="text-xs text-muted font-semibold">FARMER EXPECTED PRICE</div>
                <div style="font-size: 2rem; font-weight: 800; color: var(--primary-700);">
                  ₹${currentCrop.expectedPrice} <small class="text-xs text-muted">/ ${currentCrop.unit || 'kg'}</small>
                </div>
                <div class="text-xs text-muted" style="margin-top: 0.25rem;">
                  Available Lot: <strong>${Number(currentCrop.quantity || 0).toLocaleString()} ${currentCrop.unit || 'kg'}</strong> (Est. Total Lot Value: ₹${(Number(currentCrop.expectedPrice || 0) * Number(currentCrop.quantity || 0)).toLocaleString()})
                </div>
              </div>

              ${fairBadge ? `<div style="margin-bottom: 0.75rem;">${fairBadge}</div>` : ''}
              ${evaluation ? `
                <div style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 1.25rem; padding: 0.5rem 0.75rem; background: var(--bg-surface-secondary); border-radius: var(--radius-sm);">
                  ℹ️ ${evaluation.message}
                </div>
              ` : ''}

              <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                ${isUnavailable ? `
                  <button class="btn btn-secondary btn-lg" style="flex: 1; opacity: 0.6; cursor: not-allowed;" disabled>
                    ${isSold ? 'Sold Out' : 'Listing Unavailable'}
                  </button>
                ` : `
                  <button class="btn btn-primary btn-lg" style="flex: 1;" onclick="openMakeOfferModal()">
                    Make an Offer
                  </button>
                `}
                <a href="messages.html?partner=${currentCrop.farmerId || ''}&cropId=${currentCrop.id || ''}" class="btn btn-secondary btn-lg">
                  Chat with Farmer
                </a>
              </div>
            </div>

            <!-- Farmer Profile Card -->
            <div class="card">
              <h4 style="font-size: 1.05rem; margin-bottom: 1rem;">Farmer Information</h4>
              <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem;">
                <div class="user-avatar" style="width: 48px; height: 48px; font-size: 1.1rem;">
                  ${farmer.name ? farmer.name.split(" ").map(n => n[0]).join("").substring(0, 2) : 'RN'}
                </div>
                <div>
                  <div style="font-weight: 700;">${farmer.name}</div>
                  <div class="text-xs text-muted">Verified Grower • ${farmer.location}</div>
                  <div class="text-xs" style="color: var(--amber-500); font-weight: 700; margin-top: 2px;">
                    ${farmer.rating || 4.9} ★ (${farmer.totalTransactions || 12} successful deals)
                  </div>
                </div>
              </div>
              <p class="text-xs text-muted" style="line-height: 1.5;">
                ${farmer.about || 'Direct grower cultivating authentic produce in Andhra Pradesh.'}
              </p>
            </div>
          </div>
        </div>
      `;
      if (window.I18n && typeof window.I18n.applyTranslations === "function") window.I18n.applyTranslations();
    }

    function openMakeOfferModal() {
      if (!currentCrop) return;
      const rawStatus = String(currentCrop.status || "Available").toLowerCase().trim();
      if (rawStatus === "sold" || rawStatus === "removed") {
        window.App.showToast("This crop listing is currently unavailable for new offers.", "warning");
        return;
      }
      document.getElementById("offer-crop-id").value = currentCrop.id;
      const infoEl = document.getElementById("offer-crop-modal-info");
      if (infoEl) {
        infoEl.innerHTML = `
          <strong>${currentCrop.cropName || currentCrop.title}</strong> — Available: ${Number(currentCrop.quantity || 0).toLocaleString()} ${currentCrop.unit || 'kg'}
          <div style="margin-top: 0.2rem;">Farmer Expected Price: <strong style="color: var(--primary-700);">₹${currentCrop.expectedPrice}/${currentCrop.unit || 'kg'}</strong> (${currentCrop.farmerName || 'Farmer'})</div>
        `;
      }
      document.getElementById("offer-bid-price").value = currentCrop.expectedPrice;
      document.getElementById("offer-bid-qty").value = currentCrop.quantity;
      document.getElementById("offer-bid-qty").max = currentCrop.quantity;
      document.getElementById("offer-note").value = "";
      evaluateBidFairness();
      window.App.openModal("modal-make-offer");
    }

    function evaluateBidFairness() {
      const price = Number(document.getElementById("offer-bid-price").value) || 0;
      const qty = Number(document.getElementById("offer-bid-qty").value) || 0;
      const total = price * qty;
      document.getElementById("offer-total-amount").textContent = "₹" + total.toLocaleString();

      const preview = document.getElementById("offer-fair-preview");
      if (currentCrop && price > 0 && window.Market) {
        const cropName = currentCrop.cropName || currentCrop.title;
        preview.innerHTML = window.Market.renderPriceBenchmarkBadge(cropName, price);
      } else {
        preview.innerHTML = "";
      }
    }

    async function submitOfferAction() {
      if (!currentCrop) return;

      const price = Number(document.getElementById("offer-bid-price").value);
      const qty = Number(document.getElementById("offer-bid-qty").value);
      const note = document.getElementById("offer-note").value.trim();

      if (!price || price <= 0) {
        window.App.showToast("Please enter a valid positive bid price.", "warning");
        return;
      }

      if (!qty || qty <= 0) {
        window.App.showToast("Please enter a valid positive quantity.", "warning");
        return;
      }

      if (qty > currentCrop.quantity) {
        window.App.showToast(`Requested quantity cannot exceed available lot (${currentCrop.quantity} ${currentCrop.unit || 'kg'}).`, "warning");
        return;
      }

      const submitBtn = document.getElementById("btn-submit-offer");
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.textContent = "Submitting Offer...";
      }

      try {
        const res = await window.Offers.submitNewOffer(currentCrop.id, price, qty, note);
        if (res.success) {
          window.App.closeModal("modal-make-offer");
          window.App.showToast("Procurement offer sent to farmer! Negotiation active.", "success");
          setTimeout(() => {
            window.location.href = "offers.html";
          }, 600);
        } else {
          window.App.showToast(res.message, "error");
          if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Offer";
          }
        }
      } catch (err) {
        window.App.showToast(err.message || "Failed to submit offer.", "error");
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Offer";
        }
      }
    }
  </script>
</body>
</html>
